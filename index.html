<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculator-card">
    <h2>Basic Calculator</h2>

    <form id="calcForm">
      <!-- First Number Input -->
      <div class="form-group">
        <label for="num1">First Number:</label>
        <input type="number" id="num1" step="any" placeholder="Enter first number" required>
      </div>

      <!-- Operation Selector Dropdown -->
      <div class="form-group">
        <label for="operation">Select Operation:</label>
        <select id="operation">
          <option value="add">Addition (+)</option>
          <option value="subtract">Subtraction (−)</option>
          <option value="multiply">Multiplication (×)</option>
          <option value="divide">Division (÷)</option>
        </select>
      </div>

      <!-- Second Number Input -->
      <div class="form-group">
        <label for="num2">Second Number:</label>
        <input type="number" id="num2" step="any" placeholder="Enter second number" required>
      </div>

      <!-- Buttons -->
      <div class="button-group">
        <button type="button" id="calcBtn" onclick="calculate()">Calculate</button>
        <button type="reset" id="resetBtn" onclick="clearResult()">Reset</button>
      </div>
    </form>

    <!-- Result Display -->
    <div class="result-box">
      <h3>Result:</h3>
      <p id="output">Enter numbers and click Calculate</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
